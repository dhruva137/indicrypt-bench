[project]
name = "indicrypt-bench"
version = "0.1.0"
description = "A library-disjoint, cross-architecture benchmark for finding cryptography in stripped binaries, with a scorer for ROC-AUC, PR-AUC and false-discovery proportion under conformal selection."
readme = "PYPI.md"
license = "LicenseRef-TBA"
requires-python = ">=3.11"
authors = [{ name = "Dhruva P Gowda" }]
keywords = ["benchmark", "cryptography", "binary-analysis", "reverse-engineering", "conformal-prediction", "security"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Intended Audience :: Science/Research",
  "Topic :: Security :: Cryptography",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://papertoanything.com/products/indicrypt-bench/"
Repository = "https://github.com/dhruva137/indicrypt-bench"
Documentation = "https://github.com/dhruva137/indicrypt-bench#readme"

[project.scripts]
indicrypt-bench = "indicrypt_bench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["indicrypt_bench"]
exclude = [
  "indicrypt_bench/build.py",
  "indicrypt_bench/core_labels.py",
  "indicrypt_bench/extract*.py",
  "indicrypt_bench/extract*.json",
  "indicrypt_bench/fetch_sources.py",
  "indicrypt_bench/findcrypt_baseline.py",
  "indicrypt_bench/findcrypt_flags.csv",
  "indicrypt_bench/extra",
  "indicrypt_bench/src",
  "indicrypt_bench/objects",
  "indicrypt_bench/v2*",
  "indicrypt_bench/functions.csv.gz",
]

[tool.hatch.build.targets.sdist]
include = ["indicrypt_bench", "tests", "PYPI.md", "README.md", "LICENSE", "HF_DATASET_CARD.md", "pyproject.toml"]
exclude = ["indicrypt_bench/src", "indicrypt_bench/objects", "indicrypt_bench/v2*", "indicrypt_bench/functions.csv.gz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
