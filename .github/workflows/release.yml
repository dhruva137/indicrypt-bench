# Publish indicrypt-bench to PyPI via Trusted Publishing (no API token).
# PyPI side: owner dhruva137, repository indicrypt-bench, workflow release.yml, environment pypi.
name: release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  pypi:
    name: build and publish
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install -U pip build twine
      - name: Build sdist and wheel
        run: python -m build
      - name: Check metadata
        run: python -m twine check dist/*
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
